<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
/* ---- Portfolio-specific styles (shared.css provides base) ---- */
#bg{position:fixed;inset:0;z-index:0}

.hero{position:relative;z-index:1;padding:10rem 2rem 4rem;text-align:center}
.hero h1{font-size:clamp(2.5rem,6vw,4.5rem);font-weight:700;letter-spacing:-2px;line-height:1.1;margin-bottom:1rem}
.hero h1 .grad{background:linear-gradient(135deg,#6366f1,#a855f7,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:#8892a8;font-size:1.15rem;max-width:520px;margin:0 auto;line-height:1.6}
.hero .line{width:60px;height:3px;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:2px;margin:1.5rem auto 0}

.grid-section{position:relative;z-index:1;padding:2rem 2rem 6rem;max-width:1200px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:2rem}

.card{position:relative;background:rgba(12,16,30,.85);border:1px solid rgba(30,39,64,.5);border-radius:16px;padding:2rem;cursor:pointer;transition:transform .35s cubic-bezier(.22,1,.36,1),border-color .35s,box-shadow .4s;overflow:hidden;text-decoration:none;color:inherit;display:block}
.card::before{content:'';position:absolute;inset:0;border-radius:16px;opacity:0;transition:opacity .4s;pointer-events:none}
.card:hover{transform:translateY(-6px) scale(1.015);border-color:var(--accent);box-shadow:0 0 40px color-mix(in srgb,var(--accent) 20%,transparent),0 20px 60px rgba(0,0,0,.4)}
.card:hover::before{opacity:1;background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 70%)}

.card-head{display:flex;align-items:center;gap:1rem;margin-bottom:1.2rem}
.card-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);flex-shrink:0}
.card-title{font-size:1.3rem;font-weight:700;letter-spacing:-.5px}
.card-subtitle{color:#8892a8;font-size:.85rem;margin-bottom:1rem}
.card-desc{color:#a0a8b8;font-size:.9rem;line-height:1.65;margin-bottom:1.4rem}
.card-tags{display:flex;flex-wrap:wrap;gap:.5rem}
.card-arrow{position:absolute;top:1.5rem;right:1.5rem;width:32px;height:32px;border-radius:8px;background:rgba(99,102,241,.08);display:flex;align-items:center;justify-content:center;transition:background .3s,transform .3s}
.card:hover .card-arrow{background:var(--accent);transform:translate(2px,-2px)}
.card-arrow svg{width:16px;height:16px;stroke:#8892a8;transition:stroke .3s}
.card:hover .card-arrow svg{stroke:#fff}

@media(max-width:768px){
  .grid{grid-template-columns:1fr}
  .hero{padding:8rem 1.5rem 3rem}
}
</style>
</head>
<body>

<div class="loader" id="ld">
  <div class="loader-spin"></div>
  <div class="loader-text" data-i18n="loading">Cargando portfolio...</div>
</div>

<canvas id="bg"></canvas>

<section class="hero">
  <h1><span data-i18n="hero_line1">Construyendo cosas</span><br><span class="grad" data-i18n="hero_line2">con código & IA</span></h1>
  <p data-i18n="hero_desc">Sistemas autónomos, pipelines multi-agente y herramientas que se construyen a sí mismas.</p>
  <div class="line"></div>
</section>

<section class="grid-section" id="projects">
  <div class="grid" id="grid"></div>
</section>

<footer>
  <p data-i18n="footer">&copy; 2026 jjordan — hecho con Three.js & cafeína</p>
</footer>

<script src="nav.js"></script>
<script type="module">
import * as THREE from 'three';

// ---- i18n ----
const i18n = {
  es: {
    loading: 'Cargando portfolio...',
    nav_projects: 'Proyectos',
    hero_line1: 'Construyendo cosas',
    hero_line2: 'con código & IA',
    hero_desc: 'Sistemas autónomos, pipelines multi-agente y herramientas que se construyen a sí mismas.',
    footer: '&copy; 2026 jjordan — hecho con Three.js & cafeína'
  },
  en: {
    loading: 'Loading portfolio...',
    nav_projects: 'Projects',
    hero_line1: 'Building things',
    hero_line2: 'with code & AI',
    hero_desc: 'Autonomous systems, multi-agent pipelines, and tools that build themselves.',
    footer: '&copy; 2026 jjordan — built with Three.js & caffeine'
  }
};

let lang = localStorage.getItem('lang') || 'es';

function applyLang(lang) {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
  });
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  document.documentElement.lang = lang;
  localStorage.setItem('lang', lang);
  buildCards(lang);
  if (window.__navRender) window.__navRender();
}

const langToggle = document.getElementById('langToggle');
if (langToggle) {
  langToggle.addEventListener('click', (e) => {
    const btn = e.target.closest('.lang-btn');
    if (btn) applyLang(btn.dataset.lang);
  });
}

// ---- Three.js: AI dev scene ----
const canvas = document.getElementById('bg');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.z = 30;

let W = window.innerWidth, H = window.innerHeight;
renderer.setSize(W, H);

// --- Neural network nodes ---
const nodeCount = 120;
const nodeGeo = new THREE.BufferGeometry();
const nodePos = new Float32Array(nodeCount * 3);
const nodeCol = new Float32Array(nodeCount * 3);
const nodeSizes = new Float32Array(nodeCount);
const palette = [
  new THREE.Color('#6366f1'),
  new THREE.Color('#a855f7'),
  new THREE.Color('#3b82f6'),
  new THREE.Color('#06b6d4'),
];

for (let i = 0; i < nodeCount; i++) {
  nodePos[i * 3] = (Math.random() - 0.5) * 50;
  nodePos[i * 3 + 1] = (Math.random() - 0.5) * 35;
  nodePos[i * 3 + 2] = (Math.random() - 0.5) * 20 - 5;
  const c = palette[Math.floor(Math.random() * palette.length)];
  nodeCol[i * 3] = c.r;
  nodeCol[i * 3 + 1] = c.g;
  nodeCol[i * 3 + 2] = c.b;
  nodeSizes[i] = Math.random() * 3 + 1;
}

nodeGeo.setAttribute('position', new THREE.BufferAttribute(nodePos, 3));
nodeGeo.setAttribute('color', new THREE.BufferAttribute(nodeCol, 3));
nodeGeo.setAttribute('size', new THREE.BufferAttribute(nodeSizes, 1));

const nodeMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 } },
  vertexShader: `
    attribute float size;
    varying vec3 vColor;
    uniform float uTime;
    void main(){
      vColor = color;
      vec3 p = position;
      p.y += sin(uTime * 0.4 + position.x * 0.15) * 1.2;
      p.x += cos(uTime * 0.3 + position.z * 0.1) * 0.8;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = size * (20.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }
  `,
  fragmentShader: `
    varying vec3 vColor;
    void main(){
      float d = length(gl_PointCoord - 0.5) * 2.0;
      float glow = exp(-d * 3.0);
      float core = 1.0 - smoothstep(0.0, 0.3, d);
      float a = glow * 0.4 + core * 0.7;
      gl_FragColor = vec4(vColor, a);
    }
  `
});

const nodes = new THREE.Points(nodeGeo, nodeMat);
scene.add(nodes);

// --- Connection lines between nearby nodes ---
const lineMat = new THREE.LineBasicMaterial({ color: 0x6366f1, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending });
const lineGroup = new THREE.Group();
scene.add(lineGroup);

function updateConnections() {
  while (lineGroup.children.length) lineGroup.remove(lineGroup.children[0]);
  const pos = nodeGeo.attributes.position.array;
  const maxDist = 10;
  let linesDrawn = 0;
  for (let i = 0; i < nodeCount && linesDrawn < 80; i++) {
    for (let j = i + 1; j < nodeCount && linesDrawn < 80; j++) {
      const dx = pos[i*3] - pos[j*3];
      const dy = pos[i*3+1] - pos[j*3+1];
      const dz = pos[i*3+2] - pos[j*3+2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < maxDist) {
        const pts = [
          new THREE.Vector3(pos[i*3], pos[i*3+1], pos[i*3+2]),
          new THREE.Vector3(pos[j*3], pos[j*3+1], pos[j*3+2])
        ];
        const g = new THREE.BufferGeometry().setFromPoints(pts);
        const l = new THREE.Line(g, lineMat);
        lineGroup.add(l);
        linesDrawn++;
      }
    }
  }
}

// --- Floating code tokens ---
const codeSymbols = ['fn', '=>', '{}', 'async', 'await', '0x', 'AI', 'git', 'npm', '&&', '||', '++', 'dev', 'MR', 'PR', '#', '.ts', '.rs', 'ok', 'err'];
const tokenCanvas = document.createElement('canvas');
tokenCanvas.width = 512; tokenCanvas.height = 512;
const tokenCtx = tokenCanvas.getContext('2d');
const tokenTex = new THREE.CanvasTexture(tokenCanvas);

function drawTokens(time) {
  tokenCtx.clearRect(0, 0, 512, 512);
  tokenCtx.font = '500 18px JetBrains Mono, monospace';
  tokenCtx.fillStyle = 'rgba(99,102,241,0.35)';
  for (let i = 0; i < 25; i++) {
    const x = ((i * 73 + time * 8) % 520) - 10;
    const y = ((i * 137 + time * 3) % 520) - 10;
    tokenCtx.globalAlpha = 0.15 + Math.sin(time * 0.5 + i) * 0.1;
    tokenCtx.fillText(codeSymbols[i % codeSymbols.length], x, y);
  }
  tokenTex.needsUpdate = true;
}

const tokenPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(40, 40),
  new THREE.MeshBasicMaterial({ map: tokenTex, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.5 })
);
tokenPlane.position.z = -12;
scene.add(tokenPlane);

// --- Grid floor ---
const gridMat = new THREE.LineBasicMaterial({ color: 0x1e2740, transparent: true, opacity: 0.1 });
for (let i = -30; i <= 30; i += 4) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(i, -18, -14), new THREE.Vector3(i, 18, -14)]);
  scene.add(new THREE.Line(g, gridMat));
}
for (let i = -18; i <= 18; i += 4) {
  const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-30, i, -14), new THREE.Vector3(30, i, -14)]);
  scene.add(new THREE.Line(g, gridMat));
}

// --- Animate ---
const clock = new THREE.Clock();
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = clock.getDelta();
  frameCount++;

  nodeMat.uniforms.uTime.value = t;
  nodes.rotation.y = t * 0.015;

  // Update connections every 30 frames for performance
  if (frameCount % 30 === 0) updateConnections();

  // Floating code tokens
  drawTokens(t);
  tokenPlane.material.opacity = 0.25 + Math.sin(t * 0.3) * 0.08;

  renderer.render(scene, camera);
}
updateConnections();
animate();

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  camera.aspect = W / H;
  camera.updateProjectionMatrix();
  renderer.setSize(W, H);
});

// ---- Cards ----
const res = await fetch('./projects.json');
const projects = await res.json();
const grid = document.getElementById('grid');

function buildCards(lang) {
  grid.innerHTML = '';
  projects.forEach((p) => {
    const card = document.createElement('a');
    card.href = p.url;
    card.className = 'card';
    card.style.setProperty('--accent', p.color);
    card.innerHTML = `
      <div class="card-head">
        <div class="card-dot"></div>
        <div class="card-title">${p.title[lang]}</div>
      </div>
      <div class="card-subtitle">${p.subtitle[lang]}</div>
      <div class="card-desc">${p.description[lang]}</div>
      <div class="card-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="card-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 17L17 7M17 7H7M17 7V17"/>
        </svg>
      </div>
    `;
    grid.appendChild(card);
  });
}

buildCards(lang);
setTimeout(() => document.getElementById('ld').classList.add('off'), 400);
</script>
</body>
</html>
